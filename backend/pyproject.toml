[project]
name = "observatorio"
version = "0.1.0"
description = "API del observador de coyuntura económica de España"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv]
# Dependency cooldown: ignore releases published in the last 7 days to reduce
# exposure to compromised packages. See docs/adr/ADR-003-cuarentena-dependencias.md.
exclude-newer = "7 days"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import order, B: bugbear,
# UP: pyupgrade, SIM: simplify, N: naming, ANN: type annotations required.
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
